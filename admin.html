<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>MINDIFF — contrôle du coach</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="style.css">
  <style>
    .adm { max-width: 1100px; }
    .adm table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .adm th, .adm td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
    .adm th { color: var(--text-3); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
    .adm .tablewrap { overflow-x: auto; background: var(--surface); border-radius: var(--r); padding: 4px 12px; }
    .adm code { font-size: 12px; background: var(--surface-2); padding: 2px 6px; border-radius: 6px; }
    .adm pre { white-space: pre-wrap; background: var(--surface); padding: 12px; border-radius: var(--r-sm); font-size: 12.5px; margin: 0; }
  </style>
</head>
<body>
  <main class="wrap main adm" id="adm"><p class="fine">Chargement…</p></main>
  <script src="admin.js"></script>
</body>
</html>
